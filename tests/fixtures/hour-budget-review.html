<!doctype html><html lang="it"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifica controllo ore</title><style>body{font:16px system-ui;margin:20px;max-width:900px}button,input,select{padding:12px}summary{cursor:pointer}</style><h1>Controllo ore · dati fittizi</h1><div id="adminOperations"></div><script type="module">
import {createHourBudget} from '../../hour-budget-ui.js';
const date=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Rome'}).format(new Date()),place='Tribunale Penale Lecce';
const people=[{person_key:'one',surname:'Esempio',given_name:'Mario',site:'N153',account_id:null}];
const store={hour_budget_assignments:[{person_key:'one',valid_from:'2026-01-01',workplace:place,included:true,version:1}],hour_budget_days:[],hour_budget_calendar:[],hour_budget_roster:[{month:date.slice(0,7),confirmed:true,version:1}],documents:[]};
window.fetch=async(url,opts)=>{const body=JSON.parse(opts.body);return {ok:true,json:async()=>body.action==='roster'?{people,accounts:[],reports:[]}:{config:{schedules:[{from:'2026-01-01',hours:['4','4','4','4','4','0','0'],confirmed:true}]}}};};
const client={from(table){let mode='read',value,filters={};const q={select(){return q},order(){return q},gte(){return q},lte(){return q},eq(){return q},match(f){filters=f;return q},insert(v){mode='insert';value=v;return q},update(v){mode='update';value=v;return q},async range(){return {data:store[table],error:null}},async single(){if(mode==='insert')store[table].push({...value,version:1});else Object.assign(store[table].find(x=>Object.entries(filters).every(([k,v])=>x[k]===v)),value,{version:2});return {data:{version:1},error:null}}};return q;}};
const budget=createHourBudget({getClient:()=>client,getSession:()=>({user:{id:'demo'},access_token:'fake'}),getProfile:()=>({role:'admin',active:true})});budget.refresh();
</script></html>
