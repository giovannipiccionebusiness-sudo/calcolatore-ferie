<!doctype html><html lang="it"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prova caricamento collega</title><style>body{font:16px system-ui;margin:20px}.doc-button{padding:14px;margin:10px 0;display:block}dialog{max-width:460px;width:85%;border:1px solid #ddd;border-radius:20px;padding:20px;max-height:85vh;overflow:auto}label{display:block;margin:12px 0}input,select{display:block;box-sizing:border-box;width:100%;padding:12px}dialog::backdrop{background:#0008}</style><h1>Prova · dati fittizi</h1><section id="workerArea"><p>Caricamento personale originale</p><button id="fake">Usa PDF fittizio nella finestra</button></section><script type="module">
import {createColleagueUpload} from '../../colleague-upload.js';
let uploaded=false;const profile={active:true,role:'worker',site:'N153',can_upload_for_colleagues:true};
window.fetch=async(url,opts)=>{const b=JSON.parse(opts.body);let out,ok=true;if(b.action==='list')out={recipients:[{key:'A:recipient',name:'Mario Esempio',registered:true,workplace:'Tribunale Civile Lecce'},{key:'P:unregistered',name:'Anna Esempio',registered:false,workplace:'Tribunale Civile Lecce'}]};else if(b.action==='prepare')out={id:'test-intent-id',path:'recipient/month/doc.pdf',recipient_name:b.recipient==='P:unregistered'?'Anna Esempio':'Mario Esempio',duplicate:false,token:'fake'};else if(b.action==='upload_token')out={path:'recipient/month/doc.pdf',token:'fake'};else if(b.action==='finish'){if(!uploaded){ok=false;out={error:'Foto non ancora caricata'};}else out={id:b.id,recipient_name:'Mario Esempio'};}return {ok,json:async()=>out};};
const ctl=createColleagueUpload({getSession:()=>({user:{id:'fake-colleague-review'},access_token:'fake'}),getProfile:()=>profile,getClient:()=>({storage:{from:()=>({uploadToSignedUrl:async()=>{uploaded=true;return {error:null};}})}})});ctl.refresh();
const fake=document.getElementById('fake');new MutationObserver(()=>{const d=document.querySelector('.colleague-upload-dialog');if(d&&!d.contains(fake))d.append(fake);}).observe(document.body,{childList:true,subtree:true});
fake.onclick=()=>{const picker=document.querySelector('dialog input[type=file]');if(!picker)return;const dt=new DataTransfer();dt.items.add(new File(['%PDF-1.4\n'],'prova.pdf',{type:'application/pdf'}));picker.files=dt.files;picker.dispatchEvent(new Event('change'));};
</script></html>
